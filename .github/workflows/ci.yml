name: ASTINA Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-readiness:
    name: Security Scan & Readiness Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Validator
        run: |
          python scripts/security_validator.py

      - name: Run Production Readiness Audit
        run: |
          python audit_production_readiness.py

  automated-tests:
    name: Automated Unit & Regression Tests
    runs-on: ubuntu-latest
    needs: security-and-readiness
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Execute Pytest Suite (Core & Security)
        env:
          PYTHONPATH: .
          ASTINA_ENVIRONMENT: testing
          AUTH_ENABLED: 'false'
        run: |
          python -m pytest -v tests/test_app_startup.py tests/test_cybersecurity_and_auth.py tests/test_pipeline_edge_cases.py
