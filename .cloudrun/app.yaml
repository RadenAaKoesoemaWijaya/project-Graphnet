# Cloud Run configuration for ASTINA
# Deploy with: gcloud run deploy astina --source . --config app.yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: astina
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/astina:latest
        ports:
        - containerPort: 8501
        env:
        - name: PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: STREAMLIT_SERVER_HEADLESS
          value: "true"
        - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
          value: "none"
        - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
          value: "false"
        - name: STREAMLIT_SERVER_ENABLE_CORS
          value: "false"
        - name: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
          value: "3072"
        - name: ASTINA_LOG_FORMAT
          value: "json"
        - name: GOOGLE_CLOUD_BUCKET
          value: "astina-models-PROJECT_ID"
        - name: POLARS_SKIP_CPU_CHECK
          value: "1"
        - name: OPTUNA_N_JOBS
          value: "4"
        - name: CV_N_JOBS
          value: "4"
        resources:
          limits:
            memory: 16Gi
            cpu: "4"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      timeoutSeconds: 3600
      serviceAccountName: default
