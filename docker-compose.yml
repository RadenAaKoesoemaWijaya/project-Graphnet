services:
  graphnet-app:
    build:
      context: .
    container_name: astina-app
    ports:
      - "8501:8501"
    volumes:
      - ./cache:/app/cache
      - ./models:/app/models
    environment:
      PORT: "8501"
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "3072"
      ASTINA_LOG_FORMAT: "json"
      GOOGLE_CLOUD_BUCKET: ${GOOGLE_CLOUD_BUCKET:-}
      OPTUNA_N_JOBS: "4"
      CV_N_JOBS: "4"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
